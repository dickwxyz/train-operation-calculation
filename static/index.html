<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>调车作业计划智能体</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>调车作业计划智能体</h1>
            <p class="subtitle">按站顺编组 · 摘挂列车「调车表法」（下落 → 调整 → 暂合 → 股道分配 → 钩计划）</p>
        </header>

        <main>
            <!-- ============ 输入 ============ -->
            <section class="card">
                <h2>输入算例</h2>

                <div class="preset-row">
                    <span class="preset-label">例题：</span>
                    <button type="button" class="btn-sm preset" data-preset="例4.3">例4.3</button>
                    <button type="button" class="btn-sm preset" data-preset="例4.4">例4.4</button>
                    <button type="button" class="btn-sm preset" data-preset="例4.6">例4.6</button>
                    <span class="preset-label" style="margin-left:12px">习题：</span>
                    <button type="button" class="btn-sm preset" data-preset="习题2">习题2</button>
                    <button type="button" class="btn-sm preset" data-preset="习题3">习题3</button>
                    <button type="button" class="btn-sm preset" data-preset="习题7">习题7</button>
                    <button type="button" class="btn-sm preset" data-preset="习题8">习题8</button>
                    <button type="button" class="btn-sm preset" data-preset="习题9">习题9</button>
                    <button type="button" class="btn-sm preset" data-preset="习题12">习题12</button>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="seqInput">待编车列（支持 <code>4₂ 5₂…</code>、<code>4_2</code>、纯数字、空格/逗号分隔；字母需填站序）</label>
                        <input type="text" id="seqInput" placeholder="如 3₁4₂7₃6₂1₃2₁5₃1₁3₂5₃3₁">
                    </div>
                    <div class="form-group narrow">
                        <label for="stationOrder">站序（可选）</label>
                        <input type="text" id="stationOrder" placeholder="如 fedcba（自远及近）">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group narrow">
                        <label for="homeTrack">待编车列停留股道</label>
                        <input type="text" id="homeTrack" value="10">
                    </div>
                    <div class="form-group">
                        <label for="allowedTracks">可用作业股道（含停留道，逗号分隔；留空 = 不限）</label>
                        <input type="text" id="allowedTracks" placeholder="如 10,11,12,13">
                    </div>
                    <div class="form-group narrow">
                        <label for="budget">或：最多线路条数（含停留道）</label>
                        <input type="number" id="budget" min="2" max="10" placeholder="留空则不限">
                    </div>
                    <div class="form-group narrow">
                        <label for="departTrack">编成后转往股道</label>
                        <input type="text" id="departTrack" value="DF5">
                    </div>
                </div>

                <button type="button" class="btn btn-primary" id="solveBtn">计算调车作业计划</button>
                <div id="errorMsg" class="error-msg" style="display:none;"></div>
            </section>

            <!-- ============ 结果 ============ -->
            <div id="resultRoot" style="display:none;">
                <section class="card" id="metaCard" style="display:none;"></section>

                <section class="card" id="stageCard" style="display:none;">
                    <h2>下落 → 调整（调车表）</h2>
                    <div id="xialuoWrap"></div>
                    <div id="adjustWrap"></div>
                </section>

                <section class="card" id="schemeCard" style="display:none;">
                    <h2>暂合候选方案 <span class="hint">点击选择方案；★ 为按时间模型最优</span></h2>
                    <div id="schemePicker" class="scheme-picker"></div>

                    <div id="schemeDetail">
                        <h3>钩计划与逐步股道图</h3>
                        <div id="statsBar" class="stats-bar"></div>
                        <div id="trackAlloc" class="track-alloc"></div>
                        <div id="planTableWrap" class="table-wrapper"></div>
                        <div class="formation-section">
                            <h3>编成后车列（出发去向）</h3>
                            <div id="finalFormation" class="formation-display"></div>
                        </div>
                        <div class="yard-section">
                            <h3>逐步股道图 <span class="hint">（左=远端/内方 → 右=机车端；🚂 表示机车）</span></h3>
                            <div id="playerCtrl" class="stage-nav"></div>
                            <div id="stepInfo" class="step-info"></div>
                            <div id="yardCanvas"></div>
                        </div>
                    </div>
                </section>
            </div>
        </main>

        <footer>
            <p>调车作业计划智能体 · 教学演示工具</p>
            <p><a href="/qa" class="qa-link">教材问答 →</a></p>
        </footer>
    </div>

    <script>
        'use strict';

        // ---------------- 输入与示例 ----------------
        const PRESETS = {
            "例4.3": { seq: "b₂a₁c₁f₂e₁b₁f₂a₂c₁e₁d₂a₁", station_order: "fedcba", home: "10", allowed: "10,11,12,13", budget: "", depart: "DF3" },
            "例4.4": { seq: "edgafbgfcea", station_order: "gfedcba", home: "12", allowed: "10,11,12,13,14", budget: "", depart: "DF5" },
            "例4.6": { seq: "4₂5₂6₁3₁5₂1₃2₁4₃3₂6₁5₁3₂1₁4₂7₂", station_order: "", home: "7", allowed: "7,8,9,10", budget: "", depart: "DF3" },
            "习题2": { seq: "1₃4₁6₁5₃1₂4₁3₁2₂6₂7₃", station_order: "", home: "10", allowed: "", budget: 5, depart: "DF5" },
            "习题3": { seq: "3₁4₂7₃6₂1₃2₁5₃1₁3₂5₃3₁", station_order: "", home: "10", allowed: "", budget: 3, depart: "DF5" },
            "习题7": { seq: "73652264135347", station_order: "", home: "10", allowed: "", budget: "", depart: "DF5" },
            "习题8": { seq: "659142481736", station_order: "", home: "10", allowed: "", budget: "", depart: "DF5" },
            "习题9": { seq: "835327144357664", station_order: "", home: "10", allowed: "", budget: "", depart: "DF5" },
            "习题12": { seq: "4₃3₂6₁2₁1₃5₂4₁2₂1₃6₂5₁4₁3₁", station_order: "", home: "11", allowed: "11,12,13,14", budget: "", depart: "DF5" },
        };

        const SUB = { "₁":1,"₂":2,"₃":3,"₄":4,"₅":5,"₆":6,"₇":7,"₈":8,"₉":9 };

        document.querySelectorAll('.preset').forEach(btn => {
            btn.addEventListener('click', () => {
                const p = PRESETS[btn.dataset.preset];
                if (!p) return;
                document.getElementById('seqInput').value = p.seq;
                document.getElementById('stationOrder').value = p.station_order || '';
                document.getElementById('homeTrack').value = p.home;
                document.getElementById('allowedTracks').value = p.allowed || '';
                document.getElementById('budget').value = p.budget === '' ? '' : p.budget;
                document.getElementById('departTrack').value = p.depart;
                hideError();
                solve();
            });
        });

        document.getElementById('solveBtn').addEventListener('click', solve);

        function showError(m) { const el = document.getElementById('errorMsg'); el.textContent = m; el.style.display = 'block'; }
        function hideError() { document.getElementById('errorMsg').style.display = 'none'; }

        // 前端校验（规则与 app.py /api/solve 镜像，改规则需同步）
        function validateInput() {
            const seq = document.getElementById('seqInput').value.trim();
            if (!seq) { return '待编车列为空'; }
            const toks = tokenizeForCheck(seq);
            if (toks.length < 2) { return '待编车列至少需要 2 个车组（2 辆以上）'; }
            const order = document.getElementById('stationOrder').value.trim();
            const hasLetter = /[a-zA-Z]/.test(seq);
            if (hasLetter && !order) { return '含字母站名时请填「站序」（编成顺序，如 fedcba）'; }
            return null;
        }

        function tokenizeForCheck(seq) {
            // 简单计数（不用于求解，只做前端即时提示）
            const sep = /[\s,，]/.test(seq);
            if (sep) return seq.split(/[\s,，]+/).filter(Boolean);
            if (/[₀-₉]/.test(seq)) {
                const out = []; let i = 0;
                while (i < seq.length) {
                    const ch = seq[i];
                    if (/[0-9A-Za-z]/.test(ch)) { out.push(ch + (SUB[seq[i+1]] ? seq[++i] : '')); }
                    i++;
                }
                return out;
            }
            return seq.split('');
        }

        function buildPayload() {
            const seq = document.getElementById('seqInput').value.trim();
            const order = document.getElementById('stationOrder').value.trim();
            const home = document.getElementById('homeTrack').value.trim() || '10';
            const allowedRaw = document.getElementById('allowedTracks').value.trim();
            const budgetRaw = document.getElementById('budget').value.trim();
            const depart = document.getElementById('departTrack').value.trim() || 'DF5';
            const payload = { seq, home_track: home, depart_track: depart };
            if (order) payload.station_order = order;
            if (allowedRaw) {
                payload.allowed_tracks = allowedRaw.split(/[\s,，]+/).filter(Boolean);
                if (!payload.allowed_tracks.includes(home)) payload.allowed_tracks.unshift(home);
            } else if (budgetRaw !== '') {
                const b = parseInt(budgetRaw, 10);
                if (isNaN(b) || b < 1 || b > 10) { showError('线路条数须为 1~10 的整数'); return null; }
                payload.track_budget = b;
            }
            return payload;
        }

        // ---------------- 求解与渲染 ----------------
        let RESULT = null;

        async function solve() {
            hideError();
            const err = validateInput();
            if (err) { showError(err); return; }
            const payload = buildPayload();
            if (!payload) return;
            const btn = document.getElementById('solveBtn');
            try {
                btn.disabled = true; btn.textContent = '计算中…';
                const resp = await fetch('/api/solve', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload),
                });
                const data = await resp.json();
                if (data.error) { showError(data.error); return; }
                RESULT = data;
                renderAll();
            } catch (e) {
                showError('网络错误：无法连接到服务器');
            } finally {
                btn.disabled = false; btn.textContent = '计算调车作业计划';
            }
        }

        const PALETTE = ['#1890ff','#fa8c16','#52c41a','#722ed1','#eb2f96','#13c2c2','#a0d911','#f5222d','#2f54eb','#faad14','#08979c','#7cb305','#b37feb','#ff7a45'];
        const stationColor = s => PALETTE[(s - 1) % PALETTE.length];
        const COL_NAME = ['', '一', '二', '三', '四', '五', '六', '七', '八', '九', '十'];

        // 辆数下标：1→₁、2→₂…，多位数逐位（如 10→₁₀）。辆数恒标注（含 1）。
        const SUBDIGITS = ['₀','₁','₂','₃','₄','₅','₆','₇','₈','₉'];
        function subOf(count) {
            return String(count).split('').map(d => SUBDIGITS[+d]).join('');
        }
        function tokenText(g) { return g.station + subOf(g.count); }

        // 渲染一张"列 × 待编车组"横表；hl 为需要高亮的 pos 集合
        function colTableHtml(headerGroups, colList, hl) {
            let rows = '';
            colList.forEach((col, r) => {
                const map = {};
                col.forEach(g => map[g.pos] = g);
                let cells = '';
                headerGroups.forEach(h => {
                    const g = map[h.pos];
                    const cls = g ? (hl && hl[g.pos] ? 'cell-has cell-moved' : 'cell-has') : '';
                    const st = g ? `style="color:${stationColor(g.station)}"` : '';
                    cells += `<td class="${cls}" ${st}>${g ? tokenText(g) : ''}</td>`;
                });
                rows += `<tr><th class="row-col">${COL_NAME[r + 1]}列</th>${cells}</tr>`;
            });
            return `<div class="table-wrapper"><table class="xl-table">
                <tr><th class="row-col">待编车组</th>${headerGroups.map(h => `<th>${tokenText(h)}</th>`).join('')}</tr>
                ${rows}</table></div>`;
        }

        function renderAdjust(headerGroups, tz) {
            const wrap = document.getElementById('adjustWrap');
            const note = (tz && tz.note) || '';
            const moves = (tz && tz.moves) || [];
            let html = '<h3>第二步 · 调整（形成邻组）</h3>';
            html += `<p class="note-text">${note}</p>`;
            if (moves.length) {
                const hl = {};
                const list = moves.map(m => {
                    const g = headerGroups[m.pos - 1];
                    const n = headerGroups[m.neighbor_pos - 1];
                    hl[g.pos] = true;
                    return `<li>第 <b>${m.pos}</b> 位的 <b>${tokenText(g)}</b>：
                            列${COL_NAME[m.from_col + 1]} → 列${COL_NAME[m.to_col + 1]}，
                            与第 ${m.neighbor_pos} 位的 ${tokenText(n)} 相邻，成<b>邻组 ${tokenText(g)}${tokenText(n)}</b>
                            （同线连续，溜放可一钩，省 1 溜放钩）</li>`;
                }).join('');
                html += `<ul class="move-list">${list}</ul>`;
                html += `<div style="margin-top:6px"><p class="note-text">调整后调车表（被移入的车组以高亮标出）：</p>
                        ${colTableHtml(headerGroups, tz.cols_after, hl)}</div>`;
            }
            wrap.innerHTML = html;
        }

        // 渲染：解析摘要 + 下落表 + 调整说明
        function renderAll() {
            const root = document.getElementById('resultRoot');
            root.style.display = 'block';
            const meta = RESULT.meta, stages = RESULT.stages;

            // meta card
            const mc = document.getElementById('metaCard');
            mc.style.display = 'block';
            let groupTotals = Object.keys(meta.group_totals).map(k => ({ s: +k, c: meta.group_totals[k] }));
            groupTotals.sort((a, b) => a.s - b.s);
            mc.innerHTML = `
                <h2>算例概览</h2>
                <div class="stats-bar">
                    <span class="stat">总辆数：<strong>${meta.total_cars}</strong></span>
                    <span class="stat">去向数：<strong>${meta.max_station}</strong></span>
                    <span class="stat">停留股道：<strong>${meta.home_track}</strong></span>
                    <span class="stat">转往：<strong>${meta.depart_track}</strong></span>
                </div>
                <div class="group-totals">去向分布：
                    ${groupTotals.map(x => `<span class="chip-mini" style="background:${stationColor(x.s)}">${x.s}×${x.c}</span>`).join('')}
                </div>
                <div class="parsed-seq">待编车组（远 → 机车端）：
                    ${meta.parsed_seq.map(g => `<span class="g-chip" style="border-color:${stationColor(g.station)}">${g.station}${subOf(g.count)}</span>`).join('')}
                </div>`;

            // stage: 下落表 + 调整
            const sc = document.getElementById('stageCard');
            sc.style.display = 'block';
            const header = stages.xialuo.header;
            document.getElementById('xialuoWrap').innerHTML = `
                <h3>第一步 · 下落（原始调车表）</h3>
                ${colTableHtml(header, stages.xialuo.cols, null)}
                <p class="note-text">把反顺序车组下落到不同"列"；每列将占用一条股道（或与它列暂合共用）。同一列内部去向非降。</p>`;
            renderAdjust(header, stages.tiaozheng);

            renderSchemes();
        }

        // ---------------- 方案选择与详情 ----------------
        let CURRENT_SCHEME = null;

        function renderSchemes() {
            const schemes = RESULT.schemes || [];
            const card = document.getElementById('schemeCard');
            if (!schemes.length) {
                card.style.display = 'none';
                showError(RESULT.note || '无可行方案');
                return;
            }
            card.style.display = 'block';
            const picker = document.getElementById('schemePicker');
            picker.innerHTML = schemes.map(s => {
                const st = s.stats;
                const cls = s.best ? 'scheme-chip best' : 'scheme-chip';
                return `<button type="button" class="${cls}" data-id="${s.id}">
                    ${s.best ? '★' : ''}${s.label}
                    <span class="s-chip-sub">${st.hooks_pull}挂 · ${st.hooks_throw}溜 · ${st.hooks_transfer}转 = ${st.textbook_total}钩(${st.tracks_used}线)</span>
                </button>`;
            }).join('');
            picker.querySelectorAll('.scheme-chip').forEach(b => {
                b.addEventListener('click', () => {
                    CURRENT_SCHEME = RESULT.schemes.find(s => s.id === b.dataset.id);
                    picker.querySelectorAll('.scheme-chip').forEach(x => x.classList.toggle('active', x === b));
                    renderSchemeDetail();
                });
            });
            const best = schemes.find(s => s.best) || schemes[0];
            CURRENT_SCHEME = best;
            picker.querySelector(`[data-id="${best.id}"]`).classList.add('active');
            renderSchemeDetail();
        }

        function renderSchemeDetail() {
            const s = CURRENT_SCHEME, st = s.stats;
            const P = st.hooks_pull, H = st.hooks_throw, Z = st.hooks_transfer;
            const homeT = RESULT.meta.home_track;
            document.getElementById('statsBar').innerHTML = `
                <div class="stat-row">
                    <span class="stat">挂车钩：<strong>${P}</strong></span>
                    <span class="stat">溜放钩：<strong>${H}</strong></span>
                    <span class="stat">转线钩：<strong>${Z}</strong></span>
                </div>
                <div class="stat-row">
                    <span class="stat">总钩数（不含转线）：<strong>${st.textbook_total}</strong>
                        <span class="hint">（挂车钩数 + 溜放钩数）</span></span>
                    <span class="stat">调车程：<strong>${st.cheng}</strong>
                        <span class="hint">（挂车钩数×2 + 溜放钩数×1 + 转线钩数×1
                        = ${P}×2 + ${H}×1 + ${Z}×1）</span></span>
                </div>
                <div class="stat-row">
                    <span class="stat">含转线总钩数：<strong>${st.total_hooks}</strong></span>
                    <span class="stat">使用股道：<strong>${st.tracks_used}</strong> 条（含停留道）</span>
                </div>`;
            document.getElementById('trackAlloc').innerHTML = `
                <h4>股道分配</h4>
                <div class="table-wrapper"><table class="alloc-table">
                    <thead><tr><th>暂合列</th><th>作业股道</th><th>备注</th></tr></thead>
                    <tbody>${s.track_alloc.map(a => {
                        const seat = a.track === homeT ? '坐底（停留道）' : '';
                        return `<tr><td>${a.super}</td><td><b>${a.track}</b>道</td><td>${seat}</td></tr>`;
                    }).join('')}</tbody>
                </table></div>`;

            // 钩计划表
            const tbody = s.hooks.map((h, i) => `
                <tr class="hook-row" data-hook="${i}" data-round="${h.phase_round}">
                    <td>${h.seq}</td><td><b>${h.code}</b></td><td>${kindTag(h.kind)}</td>
                    <td>${h.qty}</td><td>${h.cars.join('')}</td><td>${h.note || ''}</td>
                </tr>`).join('');
            document.getElementById('planTableWrap').innerHTML = `
                <table id="planTable"><thead><tr>
                    <th>顺序</th><th>作业</th><th>种类</th><th>辆数</th><th>去向</th><th>说明</th>
                </tr></thead><tbody>${tbody}</tbody></table>`;

            // 编成
            const fm = document.getElementById('finalFormation');
            fm.innerHTML = s.final_formation.map((v, i) =>
                `<span class="car-tag" style="background:${stationColor(v)}">${v}</span>` +
                (i < s.final_formation.length - 1 ? '<span class="car-arrow">→</span>' : '')).join('');

            // 逐步图数据：index 0 = 初始，i>=1 = hooks[i-1].state
            PLAYER.scheme = s;
            PLAYER.states = buildStates(s);
            PLAYER.idx = 0;
            buildPlayerControls();
            drawStep();
        }

        function kindTag(k) {
            const m = { '挂': ['+', 'phase-牵出'], '溜': ['−', 'phase-解体'], '转': ['转', 'phase-转线'] };
            const x = m[k] || m['溜'];
            return `<span class="kind ${x[1]}">${x[0]}</span>`;
        }

        // 构造 states: [初始] + 每钩后状态
        function buildStates(scheme) {
            const meta = RESULT.meta;
            const home = meta.home_track;
            const trackOrder = displayOrder(scheme);
            const initTracks = {};
            trackOrder.forEach(t => initTracks[t] = []);
            let cars = [];
            meta.parsed_seq.forEach((g, i) => { for (let k = 0; k < g.count; k++) cars.push({ station: g.station, gid: g.pos }); });
            initTracks[home] = cars;
            const states = [{ tracks: initTracks, lead: [] }];
            scheme.hooks.forEach(h => states.push(h.state));
            return states;
        }

        function displayOrder(scheme) {
            // home 优先，其余数值/字典序
            const home = RESULT.meta.home_track;
            const seen = [];
            scheme.track_alloc.forEach(t => { if (!seen.includes(t.track)) seen.push(t.track); });
            seen.sort((a, b) => (a === home ? -1 : b === home ? 1 : num(a) - num(b)));
            return seen;
        }
        function num(x) { const n = parseInt(x, 10); return isNaN(n) ? x.charCodeAt(0) : n; }

        // ---------------- 逐步播放 ----------------
        const PLAYER = { scheme: null, states: [], idx: 0, maxRound: 0 };

        function buildPlayerControls() {
            const maxR = Math.max(1, ...PLAYER.scheme.hooks.map(h => h.phase_round));
            PLAYER.maxRound = maxR;
            document.getElementById('playerCtrl').innerHTML = `
                <button type="button" class="btn-sm" id="pStart">⏮ 到开始</button>
                <button type="button" class="btn-sm" id="pPrev">◀ 上一步</button>
                <button type="button" class="btn-sm" id="pNext">下一步 ▶</button>
                <button type="button" class="btn-sm" id="pRound">跳到下一轮 ▶▶</button>
                <button type="button" class="btn-sm" id="pEnd">到结尾 ⏭</button>
                <span id="pPos" class="hint" style="margin-left:8px"></span>`;
            document.getElementById('pStart').addEventListener('click', () => { PLAYER.idx = 0; drawStep(); });
            document.getElementById('pPrev').addEventListener('click', () => { if (PLAYER.idx > 0) { PLAYER.idx--; drawStep(); } });
            document.getElementById('pNext').addEventListener('click', () => { if (PLAYER.idx < PLAYER.states.length - 1) { PLAYER.idx++; drawStep(); } });
            document.getElementById('pEnd').addEventListener('click', () => { PLAYER.idx = PLAYER.states.length - 1; drawStep(); });
            document.getElementById('pRound').addEventListener('click', () => {
                const cur = PLAYER.idx === 0 ? 0 : PLAYER.scheme.hooks[PLAYER.idx - 1].phase_round;
                let nxt = PLAYER.idx;
                while (nxt < PLAYER.states.length - 1) {
                    const hr = nxt === 0 ? 0 : PLAYER.scheme.hooks[nxt - 1].phase_round;
                    if (hr > cur) break;
                    nxt++;
                }
                PLAYER.idx = nxt; drawStep();
            });
        }

        function drawStep() {
            const s = PLAYER.scheme, st = PLAYER.states[PLAYER.idx];
            const info = document.getElementById('stepInfo');
            const hook = PLAYER.idx === 0 ? null : s.hooks[PLAYER.idx - 1];
            const posEl = document.getElementById('pPos');
            if (posEl) {
                posEl.textContent = hook
                    ? `第 ${hook.seq} 钩（第 ${hook.phase_round} 轮）`
                    : `初始（待编车列在 ${RESULT.meta.home_track} 道）`;
            }
            if (hook) {
                info.innerHTML = `<span class="step-code">${hook.code}</span>　${hook.note || ''}` +
                    (hook.kind === '溜' ? `　→ ${hook.cars.length} 辆去向 <b>${hook.cars.join(' ')}</b>` : '');
            } else {
                info.textContent = '初始状态';
            }

            const order = displayOrder(s);
            let html = '';
            const shownTracks = {};
            order.forEach(t => { shownTracks[t] = st.tracks[t] || []; });
            Object.keys(st.tracks).forEach(t => { if (!(t in shownTracks)) shownTracks[t] = st.tracks[t]; });

            // 只画"出现过"的道（含空的 home）
            const active = Object.keys(shownTracks).filter(t => shownTracks[t].length || t === RESULT.meta.home_track);
            html = active.map(t => trackRowHTML(t, shownTracks[t])).join('');
            // 牵出线
            html += `<div class="track-row lead-row"><span class="track-label">牵出线</span>` +
                `<div class="track-line">${carChipsHTML(st.lead)}<span class="engine">🚂</span></div></div>`;
            document.getElementById('yardCanvas').innerHTML = html;

            // 钩表高亮
            document.querySelectorAll('#planTable .hook-row').forEach(tr => {
                const i = +tr.dataset.hook;
                tr.classList.toggle('hl', i === PLAYER.idx - 1);
            });
        }

        function trackRowHTML(label, cars) {
            return `<div class="track-row"><span class="track-label">${label}道</span>` +
                `<div class="track-line">${carChipsHTML(cars)}</div></div>`;
        }

        // 车辆图形：每辆车 = 高的一半宽（窄竖矩形），同车组相邻无间隙；
        // 1 辆车组 → 竖长方形，2 辆 → 正方形，…，整组一个 4 圆角图形；调车只改顺序不改形状。
        const CAR_H = 40;            // 车高（px）
        const CAR_W = CAR_H / 2;     // 单车宽 = 高的一半
        const GRP_GAP = 5;           // 相邻车组间距

        // 按底色亮度取文字色（浅底深字、深底白字）
        function fgColor(hex) {
            const h = hex.replace('#', '');
            const n = parseInt(h, 16);
            const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
            const lum = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
            return lum > 0.62 ? '#1a1a1a' : '#ffffff';
        }

        // 把一列"逐辆"的车按车组(gid)切成连续块，画成"组"为单位的有圆角图形
        function carChipsHTML(cars) {
            if (!cars.length) return '';
            const runs = [];
            for (const c of cars) {
                const last = runs[runs.length - 1];
                if (last && last.gid === c.gid) { last.count++; }
                else { runs.push({ gid: c.gid, station: c.station, count: 1 }); }
            }
            return runs.map(run => {
                const color = stationColor(run.station);
                const w = CAR_W * run.count;
                // 组内每辆车一个小格、各写一个去向号；同组无间隙、外轮廓整组 4 圆角
                const cells = Array.from({ length: run.count }, (_, i) =>
                    `<span${i ? ' class="cell"' : ''}>${run.station}</span>`).join('');
                return `<span class="wagon" style="width:${w}px;height:${CAR_H}px;background:${color};color:${fgColor(color)}"
                        title="去向 ${run.station} · ${run.count} 辆">${cells}</span>`;
            }).join('');
        }
    </script>
</body>
</html>
